<text x="344" y="622" font-size="17" fill="#fff" font-weight="normal" text-anchor="start" font-family="Arial">Đi ngược lại</text>
<text x="520" y="200" font-size="18" fill="#FFD600" font-weight="bold" text-anchor="start" font-family="Arial">ĐỌC (TTS)</text>
