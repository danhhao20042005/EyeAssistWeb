<text x="160" y="200" font-size="18" fill="#FFD600" font-weight="bold" text-anchor="start" font-family="Arial">ĐIỀU HƯỚNG</text>
<line x1="160" y1="212" x2="430" y2="212" stroke="#FFD600" stroke-width="3"/>
<rect x="160" y="232" width="100" height="44" rx="6" fill="#000" stroke="#FFD600" stroke-width="3"/>
