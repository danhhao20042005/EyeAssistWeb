<text x="1318" y="550" font-size="17" fill="#fff" font-weight="normal" text-anchor="start" font-family="Arial">Mở bảng phím tắt</text>
<line x1="160" y1="672" x2="1460" y2="672" stroke="#fff" stroke-width="1"/>
<text x="160" y="704" font-size="16" fill="#FFD600" font-weight="bold" text-anchor="start" font-family="Arial">Tất cả phím có thể tắt hoặc gán lại trong Cài đặt &gt; Phím tắt (WCAG 2.1.4). Bảng này cũng được đọc to khi mở.</text>
