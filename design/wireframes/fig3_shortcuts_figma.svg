<rect x="1190" y="520" width="114" height="44" rx="6" fill="#000" stroke="#FFD600" stroke-width="3"/>
<rect x="1194" y="524" width="106" height="36" rx="4" fill="none" stroke="#fff" stroke-width="1"/>
