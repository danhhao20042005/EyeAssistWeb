<text x="160" y="144" font-size="16" fill="#fff" font-weight="normal" text-anchor="start" font-family="Arial">Mở bằng F1 hoặc ?   |   Đóng bằng Esc   |   Phím đơn chỉ hoạt động khi vùng tài liệu đang có focus</text>
