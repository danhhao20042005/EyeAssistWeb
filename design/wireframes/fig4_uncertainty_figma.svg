<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1620" height="840" viewBox="0 0 1620 840">
<rect width="1620" height="840" fill="#E9EAEC"/>
<rect x="20" y="20" width="1580" height="800" fill="#000" stroke="#fff" stroke-width="3"/>
<rect x="20" y="20" width="1580" height="58" fill="#000" stroke="#fff"/>
<line x1="20" y1="78" x2="1600" y2="78" stroke="#fff" stroke-width="3"/>
<text x="40" y="58" font-size="24" fill="#FFD600" font-weight="bold" text-anchor="start" font-family="Arial">EyeAssist  |  Hỏi đáp trên hình</text>
<rect x="900" y="100" width="660" height="70" rx="10" fill="#111" stroke="#fff" stroke-width="2"/>
<text x="920" y="128" font-size="15" fill="#FFD600" font-weight="bold" text-anchor="start" font-family="Arial">Bạn</text>
<text x="920" y="156" font-size="20" fill="#fff" font-weight="normal" text-anchor="start" font-family="Arial">Doanh thu quý 3 tăng bao nhiêu so với quý 2?</text>
<rect x="46" y="186" width="1518" height="388" rx="10" fill="none" stroke="#fff" stroke-width="4"/>
<rect x="60" y="200" width="1490" height="360" rx="8" fill="#000" stroke="#FFD600" stroke-width="6"/>
<rect x="63" y="203" width="1484" height="62" rx="5" fill="#FFD600"/>
<polygon points="100,214 126,254 74,254" fill="#000"/>
<text x="100" y="249" font-size="20" fill="#FFD600" font-weight="bold" text-anchor="middle" font-family="Arial">!</text>
<text x="146" y="244" font-size="24" fill="#000" font-weight="bold" text-anchor="start" font-family="Arial">CHƯA CHẮC CHẮN  -  Độ tin cậy 62% (dưới ngưỡng 85%)</text>
<rect x="1190" y="220" width="300" height="24" rx="4" fill="#000" stroke="#000"/>
<rect x="1192" y="222" width="182.0" height="20" rx="3" fill="#FFD600"/>
<text x="90" y="312" font-size="22" fill="#fff" font-weight="normal" text-anchor="start" font-family="Arial">Có vẻ doanh thu quý 3 tăng khoảng 15% so với quý 2. Tuy nhiên nhãn trục tung bị mờ</text>
<text x="90" y="346" font-size="22" fill="#fff" font-weight="normal" text-anchor="start" font-family="Arial">nên mình chưa chắc về con số này. Bạn nên kiểm tra lại trước khi sử dụng.</text>
<rect x="90" y="370" width="1430" height="62" rx="5" fill="#111" stroke="#fff" stroke-width="2"/>
<text x="106" y="397" font-size="16" fill="#FFD600" font-weight="bold" text-anchor="start" font-family="Arial">Vì sao chưa chắc:</text>
<text x="106" y="422" font-size="16" fill="#fff" font-weight="normal" text-anchor="start" font-family="Arial">Trục Y mờ (độ phân giải thấp)   |   Cột thứ 3 bị che một phần   |   OCR nhãn trục: 58%</text>
<rect x="90" y="462" width="230" height="52" rx="6" fill="#000" stroke="#FFD600" stroke-width="4"/>
<text x="205.0" y="495" font-size="19" fill="#FFD600" font-weight="bold" text-anchor="middle" font-family="Arial">Nghe lại (R)</text>
<rect x="340" y="462" width="300" height="52" rx="6" fill="#000" stroke="#FFD600" stroke-width="4"/>
<text x="490.0" y="495" font-size="19" fill="#FFD600" font-weight="bold" text-anchor="middle" font-family="Arial">Hỏi lại cách khác (Q)</text>
<rect x="660" y="462" width="300" height="52" rx="6" fill="#000" stroke="#FFD600" stroke-width="4"/>
<text x="810.0" y="495" font-size="19" fill="#FFD600" font-weight="bold" text-anchor="middle" font-family="Arial">Xem vùng ảnh nghi ngờ</text>
<rect x="980" y="462" width="290" height="52" rx="6" fill="#000" stroke="#FFD600" stroke-width="4"/>
<text x="1125.0" y="495" font-size="19" fill="#FFD600" font-weight="bold" text-anchor="middle" font-family="Arial">Đọc văn bản OCR gốc</text>
<rect x="334" y="456" width="312" height="64" rx="8" fill="none" stroke="#fff" stroke-width="3"/>
<circle cx="54" cy="194" r="15" fill="#D6006E"/>
<text x="54" y="200" font-size="17" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Arial">1</text>
<circle cx="160" cy="282" r="15" fill="#D6006E"/>
<text x="160" y="288" font-size="17" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Arial">2</text>
<circle cx="1530" cy="232" r="15" fill="#D6006E"/>
<text x="1530" y="238" font-size="17" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Arial">3</text>
<circle cx="74" cy="400" r="15" fill="#D6006E"/>
<text x="74" y="406" font-size="17" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Arial">4</text>
<circle cx="74" cy="488" r="15" fill="#D6006E"/>
<text x="74" y="494" font-size="17" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Arial">5</text>
<text x="60" y="612" font-size="16" fill="#FFD600" font-weight="bold" text-anchor="start" font-family="Arial">LUỒNG TỰ ĐỘNG SAU KHI AI TRẢ KẾT QUẢ CHƯA CHẮC CHẮN</text>
<rect x="60" y="632" width="330" height="150" rx="8" fill="#111" stroke="#FFD600" stroke-width="3"/>
<text x="76" y="666" font-size="19" fill="#FFD600" font-weight="bold" text-anchor="start" font-family="Arial">1. AI trả kết quả</text>
<text x="76" y="700" font-size="16" fill="#fff" font-weight="normal" text-anchor="start" font-family="Arial">độ tin cậy &lt; 85%</text>
<line x1="394" y1="707" x2="432" y2="707" stroke="#fff" stroke-width="4"/>
<polygon points="432,697 448,707 432,717" fill="#fff"/>
<rect x="440" y="632" width="330" height="150" rx="8" fill="#111" stroke="#FFD600" stroke-width="3"/>
<text x="456" y="666" font-size="19" fill="#FFD600" font-weight="bold" text-anchor="start" font-family="Arial">2. Earcon + TTS</text>
<text x="456" y="700" font-size="16" fill="#fff" font-weight="normal" text-anchor="start" font-family="Arial">2 nốt đi xuống, đọc:</text>
<text x="456" y="728" font-size="16" fill="#fff" font-weight="normal" text-anchor="start" font-family="Arial">"Lưu ý, mình chưa chắc chắn"</text>
<line x1="774" y1="707" x2="812" y2="707" stroke="#fff" stroke-width="4"/>
<polygon points="812,697 828,707 812,717" fill="#fff"/>
<rect x="820" y="632" width="330" height="150" rx="8" fill="#111" stroke="#FFD600" stroke-width="3"/>
<text x="836" y="666" font-size="19" fill="#FFD600" font-weight="bold" text-anchor="start" font-family="Arial">3. Focus tự nhảy</text>
<text x="836" y="700" font-size="16" fill="#fff" font-weight="normal" text-anchor="start" font-family="Arial">vào khung cảnh báo</text>
<text x="836" y="728" font-size="16" fill="#fff" font-weight="normal" text-anchor="start" font-family="Arial">(viền đôi, tabindex = -1)</text>
<line x1="1154" y1="707" x2="1192" y2="707" stroke="#fff" stroke-width="4"/>
<polygon points="1192,697 1208,707 1192,717" fill="#fff"/>
<rect x="1200" y="632" width="330" height="150" rx="8" fill="#111" stroke="#FFD600" stroke-width="3"/>
<text x="1216" y="666" font-size="19" fill="#FFD600" font-weight="bold" text-anchor="start" font-family="Arial">4. Người dùng chọn</text>
<text x="1216" y="700" font-size="16" fill="#fff" font-weight="normal" text-anchor="start" font-family="Arial">Nghe lại / Hỏi lại / Xem</text>
<text x="1216" y="728" font-size="16" fill="#fff" font-weight="normal" text-anchor="start" font-family="Arial">Esc: trả focus về chỗ cũ</text>
</svg>